<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Search Intelligence</title>
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a class="top-nav__brand" href="/login">Search Intelligence</a>
      <div class="top-nav__cluster">
        <a class="body-md" href="/pricing">Pricing</a>
      </div>
    </nav>

    <section class="hero-band hero-band--centered">
      <div class="auth-card">
        <h1 class="display-md mb-md">Sign in</h1>
        <p class="body-md text-muted mb-lg">
          Connect Webflow and view search insights for your CMS site.
        </p>
        <form id="form">
          <div class="form-field">
            <label for="email">Email</label>
            <input class="text-input" type="email" id="email" required autocomplete="email" />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input
              class="text-input"
              type="password"
              id="password"
              required
              minlength="6"
              autocomplete="current-password"
            />
          </div>
          <div class="form-error" id="err"></div>
          <div class="btn-row" style="flex-direction: column; margin-top: 24px">
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            <button type="button" class="btn btn-secondary btn-block" id="signup">Create account</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer">
      <div class="container" style="padding: 0">
        Search Intelligence — semantic search and analytics for Webflow CMS.
      </div>
    </footer>

    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/app";

      async function auth(action) {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        document.getElementById("err").textContent = "";
        const res = await fetch("/api/auth/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("err").textContent = data.error || "Failed";
          return;
        }
        location.href = next.startsWith("/") ? next : "/app";
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        auth("login");
      });
      document.getElementById("signup").addEventListener("click", () => auth("signup"));

      fetch("/api/auth/session")
        .then((r) => r.json())
        .then((d) => {
          if (d.authenticated) location.href = "/app";
        });
    </script>
  </body>
</html>
