<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Search Intelligence</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1419;
        --card: #1a2332;
        --line: #2d3a4f;
        --text: #e7ecf3;
        --muted: #8b9cb3;
        --accent: #14b8a6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(400px, 92vw);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 28px;
      }
      h1 { margin: 0 0 6px; font-size: 1.35rem; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #042f2e;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        margin-top: 8px;
      }
      .err { color: #f87171; font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Search Intelligence</h1>
      <p>Sign in to connect Webflow and view search insights.</p>
      <form id="form">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email" />
        <label>Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        <div class="err" id="err"></div>
        <button type="submit">Sign in</button>
        <button type="button" class="secondary" id="signup">Create account</button>
      </form>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/app";

      async function auth(action) {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        document.getElementById("err").textContent = "";
        const res = await fetch("/api/auth/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("err").textContent = data.error || "Failed";
          return;
        }
        location.href = next.startsWith("/") ? next : "/app";
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        auth("login");
      });
      document.getElementById("signup").addEventListener("click", () => auth("signup"));

      fetch("/api/auth/session")
        .then((r) => r.json())
        .then((d) => {
          if (d.authenticated) location.href = "/app";
        });
    </script>
  </body>
</html>
